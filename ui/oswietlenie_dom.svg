    <!-- SIATKA 6 POMIESZCZEŃ (2 wiersze x 3 kolumny) -->

    <!-- WIERSZ 1 (y: 122, h: 104) -->
    <!-- 1. SALON (Wyłączony) -->
    <g transform="translate(36, 122)">
      <rect x="0" y="0" width="232" height="104" rx="12" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
      <g transform="translate(18, 20)">
        <path d="M6 18 L18 18 L15 6 L9 6 Z" fill="#2A2A2E" stroke="#757575" stroke-width="2"/>
        <line x1="12" y1="18" x2="12" y2="24" stroke="#757575" stroke-width="2"/>
        <line x1="7" y1="24" x2="17" y2="24" stroke="#757575" stroke-width="2"/>
      </g>
      <text x="56" y="36" fill="#E0E0E0" class="font-base room-title">SALON</text>
      <text x="56" y="56" fill="#757575" class="font-base room-subtitle">5 obwodów • Zgaszone</text>
      <g transform="translate(166, 36)">
