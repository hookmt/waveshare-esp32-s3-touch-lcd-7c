      <text x="56" y="56" fill="#757575" class="font-base room-subtitle">1 obwód • Zgaszone</text>
      <g transform="translate(166, 36)">
        <rect x="0" y="0" width="48" height="28" rx="14" fill="#2E2E32"/>
        <circle cx="14" cy="14" r="10" fill="#8E8E93"/>
      </g>
