      <text x="56" y="36" fill="#FFFFFF" class="font-base room-title">STUDIO</text>
      <text x="56" y="56" fill="#FFD54F" class="font-base room-subtitle">3 obwody • Świeci</text>
      <g transform="translate(166, 36)">
