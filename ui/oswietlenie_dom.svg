    <g transform="translate(284, 122)" filter="url(#shadow-active-light)">
      <rect x="0" y="0" width="232" height="104" rx="12" fill="url(#light-on-grad)" stroke="#FFB300" stroke-width="1.5"/>
      <g transform="translate(18, 20)">
