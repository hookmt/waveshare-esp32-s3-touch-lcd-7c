<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-active-light" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFB300" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>

    <!-- Aktywny bursztyn (zgodny ze zrzutem z HA) -->
    <linearGradient id="light-on-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543A0C"/>
      <stop offset="100%" stop-color="#362405"/>
    </linearGradient>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif; }
    .tab-text { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; }
    .room-title { font-size: 17px; font-weight: 800; letter-spacing: 0.6px; }
    .room-subtitle { font-size: 12px; font-weight: 500; }
  </style>

  <!-- 1. GŁÓWNE TŁO -->
  <rect width="800" height="480" fill="url(#bg-gradient)"/>

  <!-- 2. STAŁY GÓRNY PASEK ZAKŁADEK (H: 52px) -->
  <rect x="0" y="0" width="800" height="52" fill="#161616"/>
  <line x1="0" y1="52" x2="800" y2="52" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Tab 1: DOM -->
  <g transform="translate(12, 6)">
    <rect x="0" y="0" width="186" height="40" rx="8" fill="transparent"/>
    <text x="93" y="24" fill="#757575" class="font-base tab-text" text-anchor="middle">DOM</text>
  </g>
  <!-- Tab 2: AUDIO (SPIDER) -->
  <g transform="translate(206, 6)">
    <rect x="0" y="0" width="186" height="40" rx="8" fill="transparent"/>
    <text x="93" y="24" fill="#757575" class="font-base tab-text" text-anchor="middle">AUDIO (SPIDER)</text>
  </g>
  <!-- Tab 3: OŚW. SYPIALNIA -->
  <g transform="translate(400, 6)">
    <rect x="0" y="0" width="186" height="40" rx="8" fill="transparent"/>
    <text x="93" y="24" fill="#757575" class="font-base tab-text" text-anchor="middle">OŚW. SYPIALNIA</text>
  </g>
  <!-- Tab 4: OŚW. W DOMU (AKTYWNA) -->
  <g transform="translate(594, 6)">
    <rect x="0" y="0" width="194" height="40" rx="8" fill="#2A2D32" stroke="#3D444E" stroke-width="1.5"/>
    <rect x="20" y="36" width="154" height="4" rx="2" fill="#00E5FF"/>
    <text x="97" y="24" fill="#FFFFFF" class="font-base tab-text" text-anchor="middle">OŚW. W DOMU</text>
  </g>

  <!-- 3. OBSZAR ROBOCZY: ZAKŁADKA OŚW. W DOMU (x: 16, y: 64, w: 768, h: 338) -->
  <g filter="url(#shadow-card)">
    <rect x="16" y="64" width="768" height="338" rx="14" fill="url(#card-surface)" stroke="#2C2C2E" stroke-width="1"/>

    <!-- Pasek nadrzędny: Status + Wyłącz wszystkie -->
    <g transform="translate(36, 78)">
      <circle cx="8" cy="14" r="5" fill="#FFB300"/>
      <text x="24" y="18" fill="#E0E0E0" class="font-base" font-size="13" font-weight="700">AKTYWNE: 1 POMIESZCZENIE (STUDIO)</text>

