<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Cienie Material Design -->
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-flap" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Gradienty tła, kart i klapki -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>

    <linearGradient id="flap-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#1E1E1E"/>
    </linearGradient>

    <linearGradient id="flap-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1B1B"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif; }
    .font-mono { font-family: "SF Pro Display", "Roboto Condensed", "Impact", sans-serif; font-weight: 800; }
    .tab-text { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; }
    .metric-label { font-size: 11px; fill: #9E9E9E; font-weight: 600; letter-spacing: 0.5px; }
    .metric-val { font-size: 22px; fill: #FFFFFF; font-weight: 800; }
  </style>

  <!-- 1. GŁÓWNE TŁO -->
  <rect width="800" height="480" fill="url(#bg-gradient)"/>

  <!-- 2. STAŁY GÓRNY PASEK ZAKŁADEK (H: 52px) -->
  <rect x="0" y="0" width="800" height="52" fill="#161616"/>
  <line x1="0" y1="52" x2="800" y2="52" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Tab 1: DOM (AKTYWNA - wyraźnie wyeksponowana) -->
  <g transform="translate(12, 6)">
    <rect x="0" y="0" width="186" height="40" rx="8" fill="#2A2D32" stroke="#3D444E" stroke-width="1.5"/>
    <rect x="20" y="36" width="146" height="4" rx="2" fill="#00E5FF"/>
    <text x="93" y="24" fill="#FFFFFF" class="font-base tab-text" text-anchor="middle">DOM</text>
  </g>

  <!-- Tab 2: AUDIO (SPIDER) -->
  <g transform="translate(206, 6)">
    <rect x="0" y="0" width="186" height="40" rx="8" fill="transparent"/>
    <text x="93" y="24" fill="#757575" class="font-base tab-text" text-anchor="middle">AUDIO (SPIDER)</text>
  </g>

  <!-- Tab 3: OŚW. SYPIALNIA -->
  <g transform="translate(400, 6)">
    <rect x="0" y="0" width="186" height="40" rx="8" fill="transparent"/>
    <text x="93" y="24" fill="#757575" class="font-base tab-text" text-anchor="middle">OŚW. SYPIALNIA</text>
  </g>

  <!-- Tab 4: OŚW. W DOMU -->
  <g transform="translate(594, 6)">
    <rect x="0" y="0" width="194" height="40" rx="8" fill="transparent"/>
    <text x="97" y="24" fill="#757575" class="font-base tab-text" text-anchor="middle">OŚW. W DOMU</text>
  </g>


  <!-- 3. OBSZAR ROBOCZY: PANEL POGODOWY (x: 16, y: 64, w: 374, h: 338) -->
  <g filter="url(#shadow-card)">
    <rect x="16" y="64" width="374" height="338" rx="14" fill="url(#card-surface)" stroke="#2C2C2E" stroke-width="1"/>

    <!-- Ikona pogody -->
    <g transform="translate(36, 84)">
      <circle cx="56" cy="38" r="22" fill="#FFA726" opacity="0.95"/>
      <circle cx="56" cy="38" r="28" fill="#FFB74D" opacity="0.25"/>
      <path d="M26 62 C26 50 36 42 48 42 C52 32 64 26 78 28 C92 30 102 42 102 54 C112 54 120 62 120 72 C120 82 112 90 100 90 L32 90 C20 90 12 82 12 72 C12 66 18 62 26 62 Z"
            fill="#37474F" stroke="#455A64" stroke-width="1.5"/>
      <path d="M38 98 L32 108 M58 98 L52 108 M78 98 L72 108" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Stan i duża temperatura -->
    <text x="176" y="108" fill="#90A4AE" class="font-base" font-size="16" font-weight="700" letter-spacing="1">PRZEJAŚNIENIA</text>
    <text x="176" y="168" fill="#FFFFFF" class="font-mono" font-size="64">12°C</text>

    <!-- Linia podziału -->
    <line x1="32" y1="202" x2="374" y2="202" stroke="#2D2D2D" stroke-width="1.5"/>

    <!-- Parametry dodatkowe (wyraźne, duże wartości 22pt) -->
    <g transform="translate(36, 222)">
      <text x="0" y="0" class="font-base metric-label">WILGOTNOŚĆ</text>
      <text x="0" y="26" class="font-base metric-val">68%</text>
    </g>
    <g transform="translate(206, 222)">
      <text x="0" y="0" class="font-base metric-label">TEMP. ODCZUW.</text>
      <text x="0" y="26" class="font-base metric-val">10°C</text>
    </g>

    <g transform="translate(36, 286)">
      <text x="0" y="0" class="font-base metric-label">CIŚNIENIE</text>
      <text x="0" y="26" class="font-base metric-val">1016 hPa</text>
    </g>
    <g transform="translate(206, 286)">
      <text x="0" y="0" class="font-base metric-label">OPADY</text>
      <text x="0" y="26" class="font-base metric-val">0.0 mm</text>
    </g>
  </g>


  <!-- 4. OBSZAR ROBOCZY: PANEL ZEGARA KLAPKOWEGO (x: 410, y: 64, w: 374, h: 338) -->
  <g filter="url(#shadow-card)">
    <rect x="410" y="64" width="374" height="338" rx="14" fill="url(#card-surface)" stroke="#2C2C2E" stroke-width="1"/>

    <!-- 4 cyfry: 16 : 11 -->
    <g transform="translate(424, 88)">
      <!-- H1: 1 -->
      <g transform="translate(0, 0)" filter="url(#shadow-flap)">
        <rect x="0" y="0" width="76" height="69" rx="6" fill="url(#flap-top)"/>
        <rect x="0" y="71" width="76" height="69" rx="6" fill="url(#flap-bottom)"/>
        <rect x="0" y="69" width="76" height="2" fill="#0A0A0A"/>
        <rect x="-2" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <rect x="74" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <text x="38" y="104" fill="#F5F5F7" class="font-mono" font-size="82" text-anchor="middle">1</text>
        <line x1="0" y1="70" x2="76" y2="70" stroke="#000000" stroke-width="2" opacity="0.6"/>
      </g>

      <!-- H2: 6 -->
      <g transform="translate(86, 0)" filter="url(#shadow-flap)">
        <rect x="0" y="0" width="76" height="69" rx="6" fill="url(#flap-top)"/>
        <rect x="0" y="71" width="76" height="69" rx="6" fill="url(#flap-bottom)"/>
        <rect x="0" y="69" width="76" height="2" fill="#0A0A0A"/>
        <rect x="-2" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <rect x="74" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <text x="38" y="104" fill="#F5F5F7" class="font-mono" font-size="82" text-anchor="middle">6</text>
        <line x1="0" y1="70" x2="76" y2="70" stroke="#000000" stroke-width="2" opacity="0.6"/>
      </g>

      <!-- Dwukropek -->
      <circle cx="173" cy="50" r="5" fill="#00E5FF"/>
      <circle cx="173" cy="90" r="5" fill="#00E5FF"/>

      <!-- M1: 1 -->
      <g transform="translate(184, 0)" filter="url(#shadow-flap)">
        <rect x="0" y="0" width="76" height="69" rx="6" fill="url(#flap-top)"/>
        <rect x="0" y="71" width="76" height="69" rx="6" fill="url(#flap-bottom)"/>
        <rect x="0" y="69" width="76" height="2" fill="#0A0A0A"/>
        <rect x="-2" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <rect x="74" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <text x="38" y="104" fill="#F5F5F7" class="font-mono" font-size="82" text-anchor="middle">1</text>
        <line x1="0" y1="70" x2="76" y2="70" stroke="#000000" stroke-width="2" opacity="0.6"/>
      </g>

      <!-- M2: 1 -->
      <g transform="translate(270, 0)" filter="url(#shadow-flap)">
        <rect x="0" y="0" width="76" height="69" rx="6" fill="url(#flap-top)"/>
        <rect x="0" y="71" width="76" height="69" rx="6" fill="url(#flap-bottom)"/>
        <rect x="0" y="69" width="76" height="2" fill="#0A0A0A"/>
        <rect x="-2" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <rect x="74" y="66" width="4" height="8" rx="1" fill="#48484A"/>
        <text x="38" y="104" fill="#F5F5F7" class="font-mono" font-size="82" text-anchor="middle">1</text>
        <line x1="0" y1="70" x2="76" y2="70" stroke="#000000" stroke-width="2" opacity="0.6"/>
      </g>
    </g>

    <!-- Data -->
    <g transform="translate(424, 252)">
      <rect x="0" y="0" width="346" height="64" rx="10" fill="#141414" stroke="#2F2F32" stroke-width="1.5"/>
      <text x="173" y="27" fill="#FFFFFF" class="font-base" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">WTOREK</text>
      <text x="173" y="49" fill="#90A4AE" class="font-base" font-size="13" font-weight="600" letter-spacing="1.2" text-anchor="middle">13 PAŹDZIERNIKA 2026</text>
    </g>

    <!-- Dodatkowy status alarmu pod datą -->
    <g transform="translate(424, 324)">
      <circle cx="10" cy="4" r="3" fill="#00E676"/>
      <text x="22" y="8" fill="#8E8E93" class="font-base" font-size="11" font-weight="600">NAJBLIŻSZY BUDZIK: 06:45</text>
    </g>
  </g>


  <!-- 5. STAŁY DOLNY PASEK STATUSU (H: 58px) -->
  <g transform="translate(0, 422)">
    <rect x="0" y="0" width="800" height="58" fill="#141414"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#2A2A2A" stroke-width="1"/>

    <!-- LEWA: ŁĄCZNOŚĆ (Wi-Fi 4 kreski + Domek Home Assistant) -->
    <g transform="translate(18, 16)">
      <!-- Wi-Fi 4-kreskowe -->
      <g transform="translate(0, 4)">
        <rect x="0" y="14" width="3.5" height="6" rx="1" fill="#00E5FF"/>
        <rect x="5.5" y="10" width="3.5" height="10" rx="1" fill="#00E5FF"/>
        <rect x="11" y="6" width="3.5" height="14" rx="1" fill="#00E5FF"/>
        <rect x="16.5" y="1" width="3.5" height="19" rx="1" fill="#00E5FF"/>
      </g>
      <!-- Domek Home Assistant (połączony) -->
      <g transform="translate(32, 2)">
        <path d="M12 2 L2 11 L5 11 L5 21 L19 21 L19 11 L22 11 Z" fill="#00E5FF"/>
        <!-- Stylizowane wewnętrzne drzewko/kropki HA -->
        <circle cx="12" cy="14" r="2.2" fill="#141414"/>
        <circle cx="9" cy="17" r="1.5" fill="#141414"/>
        <circle cx="15" cy="17" r="1.5" fill="#141414"/>
        <line x1="12" y1="14" x2="9" y2="17" stroke="#141414" stroke-width="1.2"/>
        <line x1="12" y1="14" x2="15" y2="17" stroke="#141414" stroke-width="1.2"/>
      </g>
    </g>

    <!-- ŚRODEK: 4 PASTYLKI STANÓW -->
    <!-- DOM -->
    <g transform="translate(98, 12)">
      <rect x="0" y="0" width="66" height="32" rx="16" fill="#222224" stroke="#333336" stroke-width="1"/>
      <circle cx="15" cy="16" r="5" fill="#00E676"/>
      <text x="28" y="21" fill="#E0E0E0" class="font-base" font-size="11" font-weight="700">DOM</text>
    </g>
    <!-- INFR -->
    <g transform="translate(172, 12)">
      <rect x="0" y="0" width="68" height="32" rx="16" fill="#222224" stroke="#333336" stroke-width="1"/>
      <circle cx="15" cy="16" r="5" fill="#00E676"/>
      <text x="28" y="21" fill="#E0E0E0" class="font-base" font-size="11" font-weight="700">INFR</text>
    </g>
    <!-- BEZP -->
    <g transform="translate(248, 12)">
      <rect x="0" y="0" width="72" height="32" rx="16" fill="#222224" stroke="#333336" stroke-width="1"/>
      <circle cx="15" cy="16" r="5" fill="#FFA726"/>
      <text x="28" y="21" fill="#E0E0E0" class="font-base" font-size="11" font-weight="700">BEZP</text>
    </g>
    <!-- OTWARCIE (Alert) -->
    <g transform="translate(328, 12)">
      <rect x="0" y="0" width="94" height="32" rx="16" fill="#381919" stroke="#E53935" stroke-width="1.2"/>
      <circle cx="15" cy="16" r="5" fill="#E53935"/>
      <text x="27" y="21" fill="#FFCDD2" class="font-base" font-size="11" font-weight="700">OTWARTE</text>
    </g>


    <!-- PRAWA STRONA: STAŁE DEDYKOWANE SLOTY (od prawej do lewej) -->

    <!-- Slot 1: Bateria (x: 720..785) -->
    <g transform="translate(718, 18)">
      <rect x="0" y="3" width="28" height="15" rx="3" fill="none" stroke="#FFA726" stroke-width="1.6"/>
      <rect x="28" y="7" width="2.5" height="7" rx="1" fill="#FFA726"/>
      <rect x="2.5" y="5.5" width="5.5" height="10" rx="1.5" fill="#FFA726"/>
      <text x="36" y="16" fill="#FFA726" class="font-base" font-size="13" font-weight="800">15%</text>
    </g>

    <!-- Slot 2: Głośnik (x: 678, stały slot 30px) -->
    <g transform="translate(678, 18)">
      <!-- Aktywny głośnik z falami dźwięku -->
      <path d="M2 7 L6 7 L12 2 L12 20 L6 15 L2 15 Z" fill="#E0E0E0"/>
      <path d="M15 6 C17.5 8 17.5 14 15 16" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M18 3 C22 6.5 22 15.5 18 19" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Slot 3: Mikrofon / WW (x: 636, stały slot 30px) -->
    <g transform="translate(636, 17)">
      <!-- Aktywny mikrofon nasłuchu -->
      <rect x="7" y="1" width="8" height="13" rx="4" fill="#00E676"/>
      <path d="M3 8 C3 14 19 14 19 8 M11 15 L11 20 M6 20 L16 20" stroke="#00E676" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Slot 4: Budzik (x: 594, stały slot 30px - ikona budzika z dzwoneczkami) -->
    <g transform="translate(594, 17)">
      <!-- Budzik aktywny (świeci / widoczny) -->
      <circle cx="11" cy="12" r="8" fill="none" stroke="#00E5FF" stroke-width="1.8"/>
      <!-- Nóżki -->
      <line x1="5" y1="18" x2="3" y2="21" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="17" y1="18" x2="19" y2="21" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Górne dzwonki -->
      <path d="M4 6 C4 4 6 3 8 4" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M18 6 C18 4 16 3 14 4" stroke="#00E5FF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Wskazówki (godz 7:00) -->
      <polyline points="11,8 11,12 14,12" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Slot 5: Minutnik / Dzwonek (x: 552, stały slot 30px) -->
    <g transform="translate(552, 17)">
      <!-- Dzwonek minutnika aktywny -->
      <path d="M11 2 A7 7 0 0 0 4 9 L4 14 L2 16 L20 16 L18 14 L18 9 A7 7 0 0 0 11 2 Z M9 17 A2 2 0 0 0 13 17" fill="#FFA726"/>
    </g>

  </g>
</svg>
