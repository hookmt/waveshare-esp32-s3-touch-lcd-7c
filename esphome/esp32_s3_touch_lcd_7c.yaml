micro_wake_word:
  id: panel_mww
  microphone:
    microphone: panel_mic
    channels: 0
    gain_factor: 4
  task_stack_in_psram: true
  stop_after_detection: true
  vad:
  models:
    - model: alexa
      id: panel_model_alexa
    - model: okay_nabu
      id: panel_model_okay_nabu
  on_wake_word_detected:
    - logger.log:
        level: INFO
        format: "v1.7 WW detected: %s"
        args: [wake_word.c_str()]
    # Pierwszy sygnal lokalny; kolejne tury sygnalizuje HA.
    - script.execute: panel_wake_chime_play
    - script.wait: panel_wake_chime_play
    - wait_until:
        condition:
          lambda: return id(panel_signal_speaker).is_stopped() && !id(panel_speaker).has_buffered_data();
        timeout: 3s
    - if:
        condition:
          lambda: return !id(panel_signal_speaker).is_stopped() || id(panel_speaker).has_buffered_data();
        then:
          - logger.log:
              level: WARN
              format: "v1.15 WW chime: audio drain timeout, starting Assist"
    - delay: 80ms
    - voice_assistant.start:
        id: panel_assist
        wake_word: !lambda return wake_word;

switch:
  - platform: template
    name: "Wake word"
    id: panel_ww_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:microphone-message
    on_turn_on:
      - script.execute: panel_ww_restart
    on_turn_off:
      - script.stop: panel_ww_restart
      - micro_wake_word.stop:
          id: panel_mww

number:
  - platform: template
    name: "JasnoĹ›Ä‡ podĹ›wietlenia LCD"
    id: panel_lcd_brightness
    icon: mdi:brightness-6
    entity_category: config
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true
    on_value:
      then:
        - if:
            condition:
              lambda: return id(panel_ui_ready);
            then:
              - script.execute: panel_apply_backlight

  - platform: template
    name: "CzuĹ‚oĹ›Ä‡ wybudzania Alexa"
    id: panel_wake_sensitivity_alexa
    icon: mdi:ear-hearing
    entity_category: config
    mode: slider
    min_value: 1
    max_value: 15
    step: 1
    initial_value: 9
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            const float cutoff = 1.0f - (x * 0.01f);
            id(panel_model_alexa).set_probability_cutoff(
              static_cast<uint8_t>((cutoff * 255.0f) + 0.5f)
            );

