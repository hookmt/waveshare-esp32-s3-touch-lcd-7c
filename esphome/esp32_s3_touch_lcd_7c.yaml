sensor:
  # Read standard BQ27220 registers only. No control/reset/unseal/configuration writes.
  # 10 s is a diagnostic sampling period; LVGL updates only when the rounded SOC changes.
  - platform: template
    id: panel_battery_level
    name: "${friendly_name} bateria"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      // SOC, voltage, current, average current, remaining/FCC/design capacity,
      // BatteryStatus and OperationStatus. All words are little endian.
      const uint8_t registers[] = {0x2C, 0x08, 0x0C, 0x14, 0x10, 0x12, 0x3C, 0x0A, 0x3A};
      uint16_t values[9] = {};
      for (size_t i = 0; i < 9; i++) {
        uint8_t bytes[2] = {};
        // This single-byte write selects the read address, never changes register data.
        const auto result = id(bus_internal).write_readv(0x55, &registers[i], 1, bytes, sizeof(bytes));
        if (result != i2c::ERROR_OK) {
          ESP_LOGW("panel_battery", "v1.15 BQ27220 read failed reg=0x%02X error=%d", registers[i], result);
          id(panel_battery_voltage).publish_state(NAN);
          id(panel_battery_current).publish_state(NAN);
          id(panel_battery_average_current).publish_state(NAN);
          id(panel_battery_remaining).publish_state(NAN);
          id(panel_battery_full).publish_state(NAN);
          id(panel_battery_design).publish_state(NAN);
          id(panel_battery_status).publish_state(NAN);
          id(panel_battery_operation_status).publish_state(NAN);
          return NAN;
        }
        values[i] = uint16_t(bytes[0]) | (uint16_t(bytes[1]) << 8);
      }
      const int current_ma = values[2] >= 0x8000 ? int(values[2]) - 65536 : int(values[2]);
      const int average_ma = values[3] >= 0x8000 ? int(values[3]) - 65536 : int(values[3]);
      const bool present = (values[7] & 0x0008) != 0;
      const bool initialized = (values[8] & 0x0020) != 0;
      // Preserve raw diagnostic readings, even if the voltage estimate is not yet usable.
      id(panel_battery_voltage).publish_state(values[1] * 0.001f);
      id(panel_battery_current).publish_state(current_ma);
      id(panel_battery_average_current).publish_state(average_ma);
      id(panel_battery_remaining).publish_state(values[4]);
      id(panel_battery_full).publish_state(values[5]);
      id(panel_battery_design).publish_state(values[6]);
      id(panel_battery_status).publish_state(values[7]);
      id(panel_battery_operation_status).publish_state(values[8]);
      // Voltage indication: 3200 mV = 0%, 4200 mV = 100%.
      // Linear voltage scale, not remaining capacity. Zero requests software sleep, not BAT isolation.
      // Raw BQ SOC does not gate the voltage estimate; retain it in the diagnostic log.
      float voltage_percent = NAN;
      if (present && initialized && values[1] >= 2000 && values[1] <= 5000) {
        const float estimate = (float(values[1]) - 3200.0f) * 100.0f / 1000.0f;
        voltage_percent = estimate < 0.0f ? 0.0f : (estimate > 100.0f ? 100.0f : estimate);
      }
      ESP_LOGI("panel_battery", "v1.15 voltage_pct=%.1f%% BQ_SOC=%u%% U=%umV I=%dmA avg=%dmA rem=%umAh FCC=%umAh design=%umAh BS=0x%04X OS=0x%04X present=%d init=%d",
               voltage_percent, values[0], values[1], current_ma, average_ma, values[4], values[5], values[6], values[7], values[8], present, initialized);
      return voltage_percent;
    on_value:
      - script.execute: panel_refresh_battery_ui
      - if:
          condition:
            # Use the unrounded measured scale; a displayed rounded zero alone is insufficient.
            lambda: return std::isfinite(x) && x <= 0.0f && !id(panel_battery_shutdown);
          then:
            - script.execute: panel_battery_sleep
  - platform: template
