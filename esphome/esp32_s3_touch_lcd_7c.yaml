display:
  - platform: mipi_rgb
    model: RPI
    id: lcd_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pixel_mode: 16bit
    pclk_frequency: 16MHz
    pclk_inverted: true
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin: GPIO3
    pclk_pin: GPIO7
    hsync_pulse_width: 8
    hsync_back_porch: 8
    hsync_front_porch: 4
    vsync_pulse_width: 8
    vsync_back_porch: 8
    vsync_front_porch: 4
    data_pins:
      red:
        - GPIO1   # R3
        - GPIO2   # R4
        - GPIO42  # R5
        - GPIO41  # R6
        - GPIO40  # R7
      green:
        - GPIO39  # G2
        - number: GPIO0  # G3
          ignore_strapping_warning: true
        - GPIO45  # G4
        - GPIO9   # G5, pinout 7C-BOX
        - GPIO8   # G6, pinout 7C-BOX
        - GPIO21  # G7
      blue:
        - GPIO14  # B3
        - GPIO38  # B4
        - GPIO18  # B5
        - GPIO17  # B6
        - GPIO10  # B7

