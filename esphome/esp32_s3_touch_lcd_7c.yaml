# ==============================================================================
# Waveshare ESP32-S3-Touch-LCD-7C - Smart Home Touch Panel & Voice Hub
# Hardware: Waveshare ESP32-S3-Touch-LCD-7C (800x480 Capacitive Touch, ES7210 AEC, ES8311, BQ27220)
# Power: 5V/7-36V DC or 2x 18650 (1S2P) with BMS 1S protection
# Firmware: ESPHome 2026.10.2 + LVGL 8 + Custom Audio Stack
# Author: hookmt (https://github.com/hookmt)
# ==============================================================================

substitutions:
  device_name: esp32-s3-touch-lcd-7c
  friendly_name: "Touch LCD 7C Panel"
  # Home Assistant entities (customize to your setup)
  weather_entity: "weather.dom"
  spider_media_player: "media_player.spider_one_audio_receiver_2"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Waveshare ESP32-S3-Touch-LCD-7C-BOX - candidate 1.15: Google Weather for panel weather display"
  on_boot:
    # Magistrala I2C (priorytet 1000) jest gotowa, a display/LVGL jeszcze nie.
    - priority: 900
      then:
        - lambda: |-
            const uint8_t direction[] = {0x02, 0x3F, 0x00};
            const auto direction_error = id(bus_internal).write(0x24, direction, sizeof(direction));
            if (direction_error != i2c::ERROR_OK) {
              ESP_LOGE("ch32v006", "Nie udaĹ‚o siÄ™ ustawiÄ‡ kierunku EXIO (I2C 0x24), kod=%d", direction_error);
              return;
            }

            // EXIO0 LCD_RST=LOW, EXIO1 CTP_RST=HIGH, EXIO2 backlight=LOW,
            // EXIO3 PA_CTRL=LOW, EXIO4 SD_CS=HIGH, EXIO5 LCD_VDD_EN=HIGH.
            const uint8_t outputs_reset[] = {0x03, 0x32, 0x00};
            const auto reset_error = id(bus_internal).write(0x24, outputs_reset, sizeof(outputs_reset));
            if (reset_error != i2c::ERROR_OK) {
              ESP_LOGE("ch32v006", "Nie udaĹ‚o siÄ™ utrzymaÄ‡ LCD w resecie (I2C 0x24), kod=%d", reset_error);
              return;
            }

            id(panel_exio_shadow) = 0x0032;
            esphome::delay(30);

            // Zwolnienie resetu LCD. PodĹ›wietlenie i wzmacniacz pozostajÄ… wyĹ‚Ä…czone.
            const uint8_t outputs_released[] = {0x03, 0x33, 0x00};
            const auto release_error = id(bus_internal).write(0x24, outputs_released, sizeof(outputs_released));
            if (release_error != i2c::ERROR_OK) {
              ESP_LOGE("ch32v006", "Nie udaĹ‚o siÄ™ zwolniÄ‡ resetu LCD (I2C 0x24), kod=%d", release_error);
            } else {
              id(panel_exio_shadow) = 0x0033;
              ESP_LOGI("ch32v006", "CH32V006 skonfigurowany; LCD_RST zwolniony, PA_CTRL i podĹ›wietlenie wyĹ‚Ä…czone");
            }

    # Zastosuj zapamiÄ™tanÄ… jasnoĹ›Ä‡ dopiero po inicjalizacji ekranu i LVGL.
    - priority: -100
      then:
        # Check after component initialization, before enabling the backlight.
        # A valid result <= 3.2 V enters the same sleep path as a runtime reading.
        - component.update: panel_battery_level
        - lambda: id(panel_ui_ready) = true;
        - script.execute: panel_refresh_active_tab_ui
        - script.execute: panel_refresh_footer_ui
        - script.execute: panel_apply_backlight
        - script.execute: panel_refresh_battery_ui

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
    advanced:
      enable_idf_experimental_features: true

external_components:
  - source: github://n-IA-hane/esphome-audio-stack@v2026.10.2
    components:
      - esp_afe
  - source:
      type: local
      path: ../components
    components: [esp_audio_stack]

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

debug:
  update_interval: 10s

# No periodic wakeups. Reconnect external power and use RESET after charging.
deep_sleep:
  id: panel_battery_deep_sleep

globals:
  - id: panel_battery_shutdown
    type: bool
    restore_value: no
    initial_value: 'false'
  # VA status inputs: 0 ready, 1 thinking, 2 listening, 3 response, 4 error.
  - id: panel_va_event_phase
    type: int
    restore_value: no
    initial_value: '0'
  - id: panel_va_run_ended
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: panel_va_audio_seen
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: panel_va_quiet_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: panel_va_display_state
    type: int
    restore_value: no
    initial_value: '-1'
  - id: panel_active_tab_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: panel_exio_shadow
    type: uint16_t
    restore_value: no
    initial_value: '0x0032'
  - id: panel_ui_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: panel_clock_minute
    type: int
    restore_value: no
    initial_value: '-1'
  - id: panel_ww_chime_block
    type: int
    restore_value: no
    initial_value: '0'

  - id: panel_assist_phase
    type: std::string
    restore_value: no
    initial_value: '"Gotowy"'

  - id: panel_ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: spider_selection_is_radio
    type: bool
    restore_value: no
    initial_value: 'true'
esp_afe:
  id: panel_afe
  type: sr
  mode: low_cost
  mic_num: 2
  se_enabled: true
  aec_enabled: true
  ns_enabled: false
  agc_enabled: true
  input_format: mmr
  memory_alloc_mode: more_psram

esp_audio_stack:
  id: panel_audio_stack
  processor_id: panel_afe
  i2s_num: 1
  sample_rate: 48000
  # Dziedziczy poprawkÄ™ DMA z v0.59, zmianÄ… tej wersji jest kompaktowy widok Ĺ›wiateĹ‚.
  dma_desc_num: 3
  bits_per_sample: 16
  slot_bit_width: 16
  num_channels: 2
  speaker_channels: 2
  mclk_multiple: 256
  i2s_mclk_pin: GPIO6
  i2s_bclk_pin: GPIO44
  i2s_lrclk_pin: GPIO16
  i2s_din_pin: GPIO43
  i2s_dout_pin: GPIO15
  output_sample_rate: 16000
  rx_slot_mode: stereo
  rx_mic_slots: [left, right]
  codec:
    i2c_id: bus_internal
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x03
      gain_db: 24.0
    output:
      type: es8389
      address: 0x10
      use_mclk: true
      no_dac_ref: false
  on_amplifier_required:
    then:
      - lambda: |-
          if (id(panel_battery_shutdown)) return;
          const uint16_t state = id(panel_exio_shadow) | 0x0008;
          const uint8_t bytes[] = {0x03, static_cast<uint8_t>(state), static_cast<uint8_t>(state >> 8)};
          const auto result = id(bus_internal).write(0x24, bytes, sizeof(bytes));
          if (result == i2c::ERROR_OK) id(panel_exio_shadow) = state;
          ESP_LOGI("panel_audio", "v1.7 amp required: result=%d shadow=%04X", result, id(panel_exio_shadow));
  on_amplifier_idle:
    then:
      - lambda: |-
          const uint16_t state = id(panel_exio_shadow) & ~0x0008;
          const uint8_t bytes[] = {0x03, static_cast<uint8_t>(state), static_cast<uint8_t>(state >> 8)};
          const auto result = id(bus_internal).write(0x24, bytes, sizeof(bytes));
          if (result == i2c::ERROR_OK) id(panel_exio_shadow) = state;
          ESP_LOGI("panel_audio", "v1.7 amp idle: result=%d shadow=%04X", result, id(panel_exio_shadow));

microphone:
  - platform: esp_audio_stack
    id: panel_mic

speaker:
  - platform: esp_audio_stack
    id: panel_speaker
    sample_rate: 48000
    num_channels: 2
    bits_per_sample: 16
    buffer_duration: 1200ms
  - platform: mixer
    id: panel_mixer
    output_speaker: panel_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: panel_announcement_speaker
        timeout: 500ms
      - id: panel_signal_speaker
        buffer_duration: 40ms
        timeout: 500ms

media_source:
  - platform: audio_http
    id: panel_tts_source
    buffer_size: 50000
    persistent_ring_buffer: true
    task_stack_in_psram: true

# Lokalna encja jest wyĹ‚Ä…cznie wyjĹ›ciem komunikatĂłw Assist, budzika i minutnika.
media_player:
  - platform: speaker_source
    id: spider2_player
    name: "Spider 2"
    volume_initial: 100%
    volume_max: 100%
    announcement_pipeline:
      speaker: panel_announcement_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 2
      sources:
        - panel_tts_source
    on_announcement:
      - script.stop: panel_ww_restart
      - micro_wake_word.stop:
          id: panel_mww
      - logger.log: "v1.7 TTS: announcement started"
    on_state:
      - script.execute: panel_va_status_refresh
      - script.execute: panel_va_status_monitor
      - if:
          condition:
            not:
              media_player.is_announcing: spider2_player
          then:
            - script.execute: panel_ww_restart

voice_assistant:
  id: panel_assist
  microphone: panel_mic
  micro_wake_word: panel_mww
  use_wake_word: false
  media_player: spider2_player
  noise_suppression_level: 0
  auto_gain: 0dBFS
  on_client_connected:
    - logger.log: "v1.7 Assist: Home Assistant connected"
    - lambda: |-
        id(panel_ha_connected) = true;
        id(panel_va_event_phase) = 0;
        id(panel_va_run_ended) = false;
        id(panel_va_audio_seen) = false;
        id(panel_va_quiet_since) = 0;
    - script.execute: panel_va_status_refresh
    - micro_wake_word.enable_model: panel_model_alexa
    - micro_wake_word.enable_model: panel_model_okay_nabu
    - script.execute: panel_ww_restart
  on_client_disconnected:
    - logger.log: "v1.7 Assist: Home Assistant disconnected"
    - script.stop: panel_va_status_monitor
    - lambda: |-
        id(panel_ha_connected) = false;
        id(panel_va_event_phase) = 0;
        id(panel_va_run_ended) = false;
        id(panel_va_audio_seen) = false;
        id(panel_va_quiet_since) = 0;
    - script.execute: panel_va_status_refresh
    - script.stop: panel_ww_restart
    - micro_wake_word.stop:
        id: panel_mww
  on_start:
    - script.stop: panel_ww_restart
    - micro_wake_word.stop:
        id: panel_mww
    - logger.log: "v1.7 Assist: pipeline started"
    - script.stop: panel_va_status_monitor
    - lambda: |-
        id(panel_va_event_phase) = 1;
        id(panel_va_run_ended) = false;
        id(panel_va_audio_seen) = false;
        id(panel_va_quiet_since) = 0;
    - script.execute: panel_va_status_refresh
    - script.execute: panel_va_status_monitor
  on_listening:
    - logger.log: "v1.7 Assist: microphone listening"
    - lambda: id(panel_va_event_phase) = 2;
    - script.execute: panel_va_status_refresh
    - script.execute: panel_va_status_monitor
    # Kandydat: dodatkowy sygnaĹ‚ przy nasĹ‚uchu wyĹ‚Ä…czony.
  on_stt_end:
    - logger.log: "v1.7 Assist: speech-to-text finished"
    - lambda: id(panel_va_event_phase) = 1;
    - script.execute: panel_va_status_refresh
    - script.execute: panel_va_status_monitor
  on_tts_start:
    - logger.log: "v1.7 Assist: TTS response started"
    - lambda: |-
        id(panel_va_event_phase) = 3;
        id(panel_va_audio_seen) = false;
        id(panel_va_quiet_since) = 0;
    - script.execute: panel_va_status_refresh
    - script.execute: panel_va_status_monitor
    - script.execute: panel_tts_ui_window
  on_tts_end:
    - logger.log: "v1.7 Assist: TTS response generated"
    - script.execute: panel_va_status_refresh
    - script.execute: panel_va_status_monitor
  on_end:
    - logger.log: "v1.7 Assist: pipeline ended; reconcile current status"
    - lambda: id(panel_va_run_ended) = true;
    - script.execute: panel_va_status_refresh
    - script.execute: panel_va_status_monitor
    - script.execute: panel_ww_restart
  on_error:
    - logger.log: "v1.7 Assist: pipeline error"
    - script.stop: panel_va_status_monitor
    - lambda: |-
        id(panel_va_event_phase) = 4;
        id(panel_va_run_ended) = true;
        id(panel_va_audio_seen) = false;
        id(panel_va_quiet_since) = 0;
    - script.execute: panel_va_status_refresh
    - script.execute: panel_ww_restart
# ZgodnoĹ›Ä‡ ze Spiderem: API bez szyfrowania, OTA bez hasĹ‚a i szyfrowania.
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

i2c:
  - id: bus_internal
    sda: GPIO47
    scl: GPIO48
    frequency: 100kHz
    scan: true

button:
  # Manual sleep test on external power; RESET is required to resume operation.
  - platform: template
    name: "${friendly_name} test uspienia (RESET)"
    id: panel_battery_sleep_test
    entity_category: diagnostic
    icon: mdi:power-sleep
    on_press:
      - script.execute: panel_battery_sleep
  - platform: template
    name: "${friendly_name} test gĹ‚oĹ›nika"
    id: panel_speaker_test_button
    icon: "mdi:speaker-play"
    on_press:
      - script.execute: panel_audio_test
  - platform: template
    name: "SODOM Panel 7C Assist"
    id: panel_assist_button
    icon: "mdi:microphone"
    on_press:
      - voice_assistant.start:
          id: panel_assist
  - platform: template
    name: "SODOM Panel 7C Przerwij Assist"
    id: panel_assist_abort_button
    icon: mdi:microphone-off
    on_press:
      # voice_assistant.stop kieruje STOP wyĹ‚Ä…cznie do kanaĹ‚u ogĹ‚oszeĹ„ VA.
      - voice_assistant.stop:
          id: panel_assist

script:
  - id: panel_battery_sleep
    mode: single
    then:
      - lambda: |-
          id(panel_battery_shutdown) = true;
          id(panel_ui_ready) = false;
          ESP_LOGW("panel_battery", "v1.15 software sleep: U=%.3f V; reconnect power, charge, then RESET. BAT remains connected.", id(panel_battery_voltage).state);
      - script.stop: panel_ww_restart
      - script.stop: panel_va_status_monitor
      - script.stop: panel_wake_chime_play
      - script.stop: panel_audio_test
      - micro_wake_word.stop:
          id: panel_mww
      - voice_assistant.stop:
          id: panel_assist
      - media_player.stop:
          id: spider2_player
          announcement: true
      - lambda: |-
          id(panel_signal_speaker).stop();
          id(panel_announcement_speaker).stop();
          // Mixer stops with its source speakers and output speaker.
          id(panel_speaker).stop();
          id(panel_mic).stop();
      - lvgl.pause:
          show_snow: false
      - lambda: |-
          // Existing outputs only: LCD/CTP reset LOW, backlight/PA/LCD HV rail OFF.
          // Keep SD_CS HIGH and preserve the remaining expander outputs.
          const uint16_t off = (id(panel_exio_shadow) & ~uint16_t(0x002F)) | uint16_t(0x0010);
          const uint8_t bytes[] = {0x03, static_cast<uint8_t>(off), static_cast<uint8_t>(off >> 8)};
          auto result = id(bus_internal).write(0x24, bytes, sizeof(bytes));
          if (result != i2c::ERROR_OK)
            result = id(bus_internal).write(0x24, bytes, sizeof(bytes));
          if (result == i2c::ERROR_OK) {
            id(panel_exio_shadow) = off;
          } else {
            ESP_LOGE("panel_battery", "v1.15 peripheral OFF failed: I2C=%d; hardware protection is required", result);
          }
      - deep_sleep.enter: panel_battery_deep_sleep

  - id: panel_refresh_battery_ui
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!id(panel_ui_ready)) return false;
              const float soc = id(panel_battery_level).state;
              const int display = std::isfinite(soc) ? int(soc + 0.5f) : -1;
              static int previous = -2;
              if (display == previous) return false;
              previous = display;
              return true;
          then:
            - lvgl.label.update:
                id: lbl_footer_battery_value
                text: !lambda |-
                  const float soc = id(panel_battery_level).state;
                  if (!std::isfinite(soc)) return std::string("--%");
                  char value[8];
                  snprintf(value, sizeof(value), "%.0f%%", soc);
                  return std::string(value);
            - lvgl.label.update:
                id: lbl_footer_battery_icon
                text_color: !lambda |-
                  const float soc = id(panel_battery_level).state;
                  if (!std::isfinite(soc)) return lv_color_hex(0x8D969F);
                  return lv_color_hex(soc <= 20.0f ? 0xFF5252 : 0x00E676);

  # Etap I: dane HA sÄ… odbierane stale, kontrolki tylko na aktywnej karcie.
  - id: panel_refresh_clock
    mode: restart
    parameters:
      force_refresh: bool
    then:
      - if:
          condition:
            lambda: |-
              if (!id(panel_ui_ready) || id(panel_active_tab_index) != 0) return false;
              const auto now = id(panel_ha_time).now();
              if (!now.is_valid()) return false;
              return force_refresh || (now.hour * 60 + now.minute) != id(panel_clock_minute);
          then:
            - lvgl.label.update:
                id: lbl_clock_hour_tens
                text: !lambda |-
                  const auto now = id(panel_ha_time).now();
                  char value[3];
                  snprintf(value, sizeof(value), "%02d", now.hour);
                  return std::string(1, value[0]);
            - lvgl.label.update:
                id: lbl_clock_hour_ones
                text: !lambda |-
                  const auto now = id(panel_ha_time).now();
                  char value[3];
                  snprintf(value, sizeof(value), "%02d", now.hour);
                  return std::string(1, value[1]);
            - lvgl.label.update:
                id: lbl_clock_minute_tens
                text: !lambda |-
                  const auto now = id(panel_ha_time).now();
                  char value[3];
                  snprintf(value, sizeof(value), "%02d", now.minute);
                  return std::string(1, value[0]);
            - lvgl.label.update:
                id: lbl_clock_minute_ones
                text: !lambda |-
                  const auto now = id(panel_ha_time).now();
                  char value[3];
                  snprintf(value, sizeof(value), "%02d", now.minute);
                  return std::string(1, value[1]);
            - lvgl.label.update:
                id: lbl_clock_weekday
                text: !lambda |-
                  const auto now = id(panel_ha_time).now();
                  static const char *weekdays[] = {"", "NIEDZIELA", "PONIEDZIAĹEK", "WTOREK", "ĹšRODA", "CZWARTEK", "PIÄ„TEK", "SOBOTA"};
                  if (now.day_of_week < 1 || now.day_of_week > 7) return std::string("--");
                  return std::string(weekdays[now.day_of_week]);
            - lvgl.label.update:
                id: lbl_clock_date
                text: !lambda |-
                  const auto now = id(panel_ha_time).now();
                  static const char *months[] = {"", "stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "wrzeĹ›nia", "paĹşdziernika", "listopada", "grudnia"};
                  char value[32];
                  if (now.month < 1 || now.month > 12) {
                    snprintf(value, sizeof(value), "%02d.%02d.%04d", now.day_of_month, now.month, now.year);
                  } else {
                    snprintf(value, sizeof(value), "%02d %s %04d", now.day_of_month, months[now.month], now.year);
                  }
                  return std::string(value);

            - lambda: |-
                const auto now = id(panel_ha_time).now();
                id(panel_clock_minute) = now.hour * 60 + now.minute;

  - id: panel_refresh_dom_ui
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(panel_ui_ready) && id(panel_active_tab_index) == 0;
          then:
            - lvgl.label.update:
                id: lbl_weather_icon
                text: !lambda |-
                  if (!id(panel_weather_condition).has_state()) return std::string("\U000F0590");
                  const auto state = id(panel_weather_condition).state;
                  if (state == "clear-night") return std::string("\U000F0594");
                  if (state == "sunny") return std::string("\U000F0599");
                  if (state == "partlycloudy") return std::string("\U000F0595");
                  if (state == "cloudy") return std::string("\U000F0590");
                  if (state == "rainy") return std::string("\U000F0597");
                  if (state == "pouring") return std::string("\U000F0596");
                  if (state == "fog") return std::string("\U000F0591");
                  if (state == "snowy") return std::string("\U000F0598");
                  if (state == "windy" || state == "windy-variant") return std::string("\U000F059D");
                  return std::string("\U000F0590");
            - lvgl.label.update:
                id: lbl_weather_temp
                text: !lambda |-
                  if (!id(panel_weather_temp).has_state()) return std::string("--.-Â°C");
                  char value[16];
                  snprintf(value, sizeof(value), "%.1fÂ°C", id(panel_weather_temp).state);
                  return std::string(value);
            - lvgl.label.update:
                id: lbl_weather_condition
                text: !lambda |-
                  if (!id(panel_weather_condition).has_state()) return std::string("BRAK DANYCH POGODOWYCH");
                  const auto state = id(panel_weather_condition).state;
                  if (state == "clear-night") return std::string("BEZCHMURNA NOC");
                  if (state == "sunny") return std::string("SĹONECZNIE");
                  if (state == "partlycloudy") return std::string("CZÄĹšCIOWE ZACHMURZENIE");
                  if (state == "cloudy") return std::string("POCHMURNO");
                  if (state == "rainy") return std::string("DESZCZ");
                  if (state == "pouring") return std::string("ULEWA");
                  if (state == "fog") return std::string("MGĹA");
                  if (state == "snowy") return std::string("ĹšNIEG");
                  if (state == "windy") return std::string("WIETRZNIE");
                  if (state == "windy-variant") return std::string("WIETRZNIE I POCHMURNO");
                  return state;
            - lvgl.label.update:
                id: lbl_weather_humidity
                text: !lambda |-
                  if (!id(panel_weather_humidity).has_state()) return std::string("--%");
                  char value[12];
                  snprintf(value, sizeof(value), "%.0f%%", id(panel_weather_humidity).state);
                  return std::string(value);
            - lvgl.label.update:
                id: lbl_weather_feels_like
