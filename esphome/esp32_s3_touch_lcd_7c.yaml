  - id: panel_apply_backlight
    mode: restart
    then:
      - lambda: |-
          if (id(panel_battery_shutdown)) return;
          const int requested = static_cast<int>(id(panel_lcd_brightness).state + 0.5f);
          if (requested <= 0) {
            const uint16_t state = id(panel_exio_shadow) & ~0x0004;
            const uint8_t bytes[] = {0x03, static_cast<uint8_t>(state), static_cast<uint8_t>(state >> 8)};
            const auto result = id(bus_internal).write(0x24, bytes, sizeof(bytes));
            if (result == i2c::ERROR_OK) {
              id(panel_exio_shadow) = state;
              ESP_LOGI("ch32v006", "LCD backlight OFF, brightness=0%%");
            } else {
              ESP_LOGE("ch32v006", "Nie udaĹ‚o siÄ™ wyĹ‚Ä…czyÄ‡ podĹ›wietlenia, kod=%d", result);
            }
            return;
          }

          // Suwak 0 wyĹ‚Ä…cza podĹ›wietlenie; 1-100 mapuje niezerowe PWM 1-255.
          const int brightness = requested < 1 ? 1 : (requested > 100 ? 100 : requested);
          const uint8_t pwm_value = static_cast<uint8_t>(1 + ((brightness - 1) * 254 + 49) / 99);
          const uint8_t pwm_bytes[] = {0x05, pwm_value};
          const auto pwm_result = id(bus_internal).write(0x24, pwm_bytes, sizeof(pwm_bytes));
          if (pwm_result != i2c::ERROR_OK) {
            ESP_LOGE("ch32v006", "Nie udaĹ‚o siÄ™ ustawiÄ‡ PWM podĹ›wietlenia na %d%%, kod=%d", requested, pwm_result);
            return;
          }

          const uint16_t state = id(panel_exio_shadow) | 0x0004;
          const uint8_t output_bytes[] = {0x03, static_cast<uint8_t>(state), static_cast<uint8_t>(state >> 8)};
          const auto output_result = id(bus_internal).write(0x24, output_bytes, sizeof(output_bytes));
          if (output_result == i2c::ERROR_OK) {
            id(panel_exio_shadow) = state;
            ESP_LOGI("ch32v006", "LCD backlight ON, jasnoĹ›Ä‡=%d%%, PWM=%u, EXIO shadow=%04X",
                     requested, pwm_bytes[1], state);
          } else {
            ESP_LOGE("ch32v006", "Nie udaĹ‚o siÄ™ wĹ‚Ä…czyÄ‡ podĹ›wietlenia, kod=%d", output_result);
          }

  - id: panel_ww_restart
    mode: restart
    then:
      - delay: 1500ms
      - wait_until:
          condition:
            and:
              - lambda: return id(panel_ha_connected) && !id(panel_battery_shutdown);
              - switch.is_on: panel_ww_enabled
              - not:
                  voice_assistant.is_running:
