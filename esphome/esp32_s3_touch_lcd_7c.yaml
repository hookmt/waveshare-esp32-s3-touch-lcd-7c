                  media_player.is_announcing: spider2_player
          timeout: 60s
      - if:
          condition:
            and:
              - lambda: return id(panel_ha_connected) && !id(panel_battery_shutdown);
              - switch.is_on: panel_ww_enabled
              - not:
                  voice_assistant.is_running:
                    id: panel_assist
              - not:
                  media_player.is_announcing: spider2_player
              - not:
                  micro_wake_word.is_running:
                    id: panel_mww
          then:
            - micro_wake_word.start:
                id: panel_mww
            - logger.log:
                level: INFO
                format: "v1.7 WW listening: Alexa / Okay Nabu"
  - id: panel_wake_chime_play
    mode: single
    then:
      - lambda: |-
          id(panel_ww_chime_block) = 0;
          id(panel_signal_speaker).set_audio_stream_info(audio::AudioStreamInfo(16, 2, 48000));
          id(panel_signal_speaker).start();
          id(panel_speaker).start();
          ESP_LOGI("panel_audio", "v1.7 WW chime: starting generated two-tone");
      - wait_until:
          condition:
            lambda: return id(panel_signal_speaker).is_running() && id(panel_speaker).is_running();
          timeout: 3s
      - if:
          condition:
            lambda: return id(panel_signal_speaker).is_running() && id(panel_speaker).is_running();
          then:
            - repeat:
                count: 18
                then:
                  - lambda: |-
                      // 10 ms stereo PCM blocks; reuse the tested signal-speaker/mixer path.
                      static uint8_t pcm[1920];
                      const int block = id(panel_ww_chime_block);
                      const int frequency = block < 8 ? 660 : (block < 10 ? 0 : 880);
                      for (int i = 0; i < 480; ++i) {
                        int16_t sample = 0;
                        if (frequency != 0) {
                          const uint64_t sample_index = static_cast<uint64_t>(block * 480 + i);
                          const uint32_t half_wave = static_cast<uint32_t>((sample_index * frequency * 2) / 48000);
                          sample = (half_wave & 1) ? -5200 : 5200;
                        }
                        const uint16_t value = static_cast<uint16_t>(sample);
                        const int offset = i * 4;
                        pcm[offset] = pcm[offset + 2] = static_cast<uint8_t>(value & 0xFF);
                        pcm[offset + 1] = pcm[offset + 3] = static_cast<uint8_t>(value >> 8);
                      }
                      const size_t written = id(panel_signal_speaker).play(pcm, sizeof(pcm));
                      if (written != sizeof(pcm)) {
                        ESP_LOGW("panel_audio", "v1.7 WW chime partial write: %u/1920", unsigned(written));
                      }
                      id(panel_ww_chime_block) = block + 1;
                  - delay: 10ms
            - speaker.finish: panel_signal_speaker
            - delay: 120ms
            - logger.log: "v1.7 WW chime: two-tone drained"
          else:
            - speaker.stop: panel_signal_speaker
            - logger.log:
                level: WARN
                format: "v1.7 WW chime: speaker start timeout"
  - id: panel_tts_ui_window
    mode: restart
    then:
      # PrĂłba A/B: LVGL dziaĹ‚a takĹĽe przy starcie TTS.
      # Bez pause/resume i wymuszanego przez resume odrysowania caĹ‚ego ekranu.
      - logger.log:
          level: INFO
          format: "v1.7 TTS UI test: continuous LVGL, no pause/resume"
  # Reconcile from current inputs, never from the text left on the screen.
  - id: panel_va_status_refresh
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!id(panel_ui_ready)) return false;
              const bool connected = id(panel_ha_connected);
              const bool running = id(panel_assist).is_running();
              const auto player = id(spider2_player).state;
              const bool playing = player == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                   player == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
              const bool idle = player == media_player::MEDIA_PLAYER_STATE_IDLE;
              const uint32_t now = millis();
              int phase = id(panel_va_event_phase);
              if (connected && phase == 3) {
                if (playing) id(panel_va_audio_seen) = true;
                // Start the existing margin only after observed audio, idle and VA end.
                if (id(panel_va_audio_seen) && idle && !running && id(panel_va_run_ended)) {
                  if (id(panel_va_quiet_since) == 0) id(panel_va_quiet_since) = now;
                  if (uint32_t(now - id(panel_va_quiet_since)) >= 2500) phase = 0;
                } else {
                  id(panel_va_quiet_since) = 0;
                }
              } else if (connected && (phase == 1 || phase == 2) &&
                         id(panel_va_run_ended) && !running && idle) {
                phase = 0;  // Completed command without a spoken TTS response.
              }
              id(panel_va_event_phase) = phase;
              int display = connected ? phase : 5;
              if (display == 0 && !id(panel_ww_enabled).state) display = 6;
              if (display == id(panel_va_display_state)) return false;
              id(panel_va_display_state) = display;
              switch (display) {
                case 0: id(panel_assist_phase) = "Alexa / Okay Nabu: czuwam"; break;
                case 1: id(panel_assist_phase) = "Mowa rozpoznana"; break;
                case 2: id(panel_assist_phase) = "Slucham..."; break;
                case 3: id(panel_assist_phase) = "Odpowiadam..."; break;
                case 4: id(panel_assist_phase) = "Blad Assist"; break;
                case 5: id(panel_assist_phase) = "HA rozlaczone"; break;
                case 6: id(panel_assist_phase) = "WW wylaczone"; break;
              }
              ESP_LOGI("va_status", "v1.7 display=%d va=%d end=%d player=%d seen=%d",
                       display, running, id(panel_va_run_ended), int(player), id(panel_va_audio_seen));
              return true;
          then:
            - lvgl.widget.update:
                id: status_va_chip
                bg_color: !lambda |-
                  switch (id(panel_va_display_state)) {
                    case 1: return lv_color_hex(0xA85000);
                    case 2: return lv_color_hex(0x145AA0);
                    case 3: return lv_color_hex(0x177A3B);
                    case 4: return lv_color_hex(0x9A2F2F);
                    case 5: return lv_color_hex(0x66717D);
                    default: return lv_color_hex(0x20262D);
                  }
            - lvgl.label.update:
                id: lbl_status_va
                text: !lambda |-
                  switch (id(panel_va_display_state)) {
                    case 1: return std::string("MYĹšLI");
                    case 2: return std::string("SĹUCHA");
                    case 3: return std::string("ODPOWIADA");
                    case 4: return std::string("BĹÄ„D");
                    case 5: return std::string("HA ?");
                    case 6: return std::string("WW OFF");
                    default: return std::string("CZUWA");
                  }
                text_color: 0xFFFFFF

  - id: panel_va_status_monitor
    mode: single
    then:
      # Events do not restart the delay: a busy player cannot starve the 1 s check.
      # New Assist start explicitly cancels the old monitor and resets its inputs.
      - repeat:
          count: 180
          then:
            - delay: 1s
            - script.execute: panel_va_status_refresh
            - if:
                condition:
                  lambda: return !id(panel_ha_connected) || id(panel_va_event_phase) == 0 || id(panel_va_event_phase) == 4;
                then:
                  - script.stop: panel_va_status_monitor
      # A timeout is not proof of completed audio. Keep the last state and report it.
      - logger.log:
          level: WARN
          format: "v1.7 VA status: 180 s check limit; phase=%d va=%d end=%d player=%d seen=%d"
          args: ['id(panel_va_event_phase)', 'id(panel_assist).is_running()', 'id(panel_va_run_ended)', 'int(id(spider2_player).state)', 'id(panel_va_audio_seen)']

  - id: panel_open_media_list
    mode: restart
    parameters:
      is_radio: bool
    then:
      - lambda: id(spider_selection_is_radio) = is_radio;
      - lvgl.label.update:
          id: lbl_spider_selection_title
          text: !lambda |-
            return id(spider_selection_is_radio)
              ? std::string("RADIO  /  WYBIERZ STACJÄ")
              : std::string("SPOTIFY  /  PLAYLISTY");
      - script.execute: panel_refresh_media_list
      - lvgl.widget.show: spider_selection_overlay

  - id: panel_refresh_media_list
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(panel_ui_ready) && id(panel_active_tab_index) == 1;
          then:
            - lambda: |-
                lv_obj_t *buttons[] = {
                  id(btn_spider_choice_01), id(btn_spider_choice_02),
                  id(btn_spider_choice_03), id(btn_spider_choice_04),
                  id(btn_spider_choice_05), id(btn_spider_choice_06),
                  id(btn_spider_choice_07), id(btn_spider_choice_08),
                  id(btn_spider_choice_09), id(btn_spider_choice_10),
                  id(btn_spider_choice_11), id(btn_spider_choice_12)
                };
                lv_obj_t *labels[] = {
                  id(lbl_spider_choice_01), id(lbl_spider_choice_02),
                  id(lbl_spider_choice_03), id(lbl_spider_choice_04),
                  id(lbl_spider_choice_05), id(lbl_spider_choice_06),
                  id(lbl_spider_choice_07), id(lbl_spider_choice_08),
                  id(lbl_spider_choice_09), id(lbl_spider_choice_10),
                  id(lbl_spider_choice_11), id(lbl_spider_choice_12)
                };

                const char *radio_defaults[] = {
                  "Anty Radio", "Antyradio Hard", "ESKA ROCK", "Radio 357",
                  "Radio Nowy Ĺšwiat", "Radio Zet", "RMF FM", "TokFM",
                  "Radio Plus", "PR TRĂ“JKA", "Chilli Zet",
                  "Zak - stidenckie radio Politechniki ĹĂłdzkiej"
                };
                const char *playlist_defaults[] = {
                  "Liked Songs hook_mt", "500 Random tracks (from library)",
                  "Folk Metal", "Electro", "Audio test",
                  "Odkryj w tym tygodniu", "\"LubiÄ™ to\" z radia",
                  "Melodic Death Metal 2020", "Hity z radia 2026",
                  "All favorited tracks"
                };

                const bool use_radio = id(spider_selection_is_radio);
                const std::string raw = use_radio
                  ? (id(spider_radio_options).has_state() ? id(spider_radio_options).state : std::string())
                  : (id(spider_playlist_options).has_state() ? id(spider_playlist_options).state : std::string());
                const bool use_defaults = raw.empty() || raw == "unknown" || raw == "unavailable";
                const char *const *defaults = use_radio ? radio_defaults : playlist_defaults;
                const size_t default_count = use_radio ? 12 : 10;

                size_t cursor = 0;
                for (size_t i = 0; i < 12; ++i) {
                  std::string item;
                  if (use_defaults) {
                    if (i < default_count) item = defaults[i];
                  } else if (cursor <= raw.size()) {
                    const size_t separator = raw.find('~', cursor);
                    const size_t end = separator == std::string::npos ? raw.size() : separator;
                    item = raw.substr(cursor, end - cursor);
                    cursor = separator == std::string::npos ? raw.size() + 1 : separator + 1;
                  }

                  if (item.empty()) {
                    lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_HIDDEN);
                  } else {
                    lv_label_set_text(labels[i], item.c_str());
                    lv_obj_clear_flag(buttons[i], LV_OBJ_FLAG_HIDDEN);
                  }
                }

  - id: panel_ma_play
    mode: restart
    parameters:
      media_name: string
      media_type: string
    then:
      - homeassistant.action:
          action: music_assistant.play_media
          data:
            entity_id: media_player.spider_one_audio_receiver_2
            enqueue: replace
          data_template:
            media_id: "{{ requested_media_id }}"
            media_type: "{{ requested_media_type }}"
          variables:
            requested_media_id: !lambda 'return media_name;'
            requested_media_type: !lambda 'return media_type;'
          on_success:
            - logger.log:
                level: INFO
                format: "Music Assistant: wysĹ‚ano polecenie odtwarzania"
          on_error:
            - logger.log:
                level: WARN
                format: "Music Assistant: nie udaĹ‚o siÄ™ uruchomiÄ‡ pozycji"

  - id: panel_audio_test
    mode: single
    then:
      - lambda: |-
          id(panel_signal_speaker).set_audio_stream_info(audio::AudioStreamInfo(16, 2, 48000));
          id(panel_signal_speaker).start();
          id(panel_speaker).start();
          ESP_LOGI("panel_audio", "v1.7 tone: requested 48000Hz / stereo / 16bit");
      - wait_until:
          condition:
            lambda: return id(panel_signal_speaker).is_running() && id(panel_speaker).is_running();
          timeout: 3s
      - if:
          condition:
            lambda: return id(panel_signal_speaker).is_running() && id(panel_speaker).is_running();
          then:
            - repeat:
                count: 20
                then:
                  - lambda: |-
                      // 10ms PCM stereo. Small fixed buffer avoids vector allocations.
                      static uint8_t pcm[1920];
                      for (int i = 0; i < 480; ++i) {
                        const int16_t sample = (i % 60 < 30) ? 9000 : -9000;
                        const uint16_t value = static_cast<uint16_t>(sample);
                        const int offset = i * 4;
                        pcm[offset] = pcm[offset + 2] = static_cast<uint8_t>(value & 0xFF);
                        pcm[offset + 1] = pcm[offset + 3] = static_cast<uint8_t>(value >> 8);
                      }
                      const size_t written = id(panel_signal_speaker).play(pcm, sizeof(pcm));
                      if (written != sizeof(pcm)) {
                        ESP_LOGW("panel_audio", "v1.7 tone partial write: %u/1920", unsigned(written));
                      }
                  - delay: 10ms
            - speaker.finish: panel_signal_speaker
            - logger.log: "v1.7 tone: 200ms queued through mixer; source finishing"
          else:
            - speaker.stop: panel_signal_speaker
            - logger.log:
                level: WARN
                format: "v1.7 tone: speaker start timeout"
